<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <linearGradient id="front" x1="0.04" y1="0.04" x2="0.96" y2="0.96">
      <stop offset="0" stop-color="#84d4ff" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#59b7fa" stop-opacity="0.94"/>
      <stop offset="0.8" stop-color="#3998ee" stop-opacity="0.96"/>
