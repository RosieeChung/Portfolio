<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D 디자이너 포트폴리오</title>

  <link rel="stylesheet" href="assets/css/base.css?v=v189-line-blue">
  <link rel="stylesheet" href="assets/css/landing.css?v=hover-motion-4">
  <link rel="stylesheet" href="assets/css/workspace.css?v=v198-half-solo">
  <link rel="stylesheet" href="assets/css/animations.css?v=v94layered">
  <link rel="stylesheet" href="assets/css/responsive.css?v=v175-fullbleed-cover">
<link rel="stylesheet" href="assets/css/project-layout-only.css?v=modal-menu-align-1"><link rel="stylesheet" href="assets/css/workstyle-cards.css?v=timeline-schools-11"></head>
<body>
  <main class="app" id="app">
    <div class="grid-bg"></div>
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <div class="warp-layer" id="warpLayer" aria-hidden="true">
      <span class="warp-core"></span>
      <span class="warp-ring warp-ring-a"></span>
      <span class="warp-ring warp-ring-b"></span>
      <span class="warp-streaks"></span>
    </div>

    <section class="landing" id="landing">
      <button class="start-folder start-folder-v128" id="startFolder" type="button" aria-label="Open portfolio">
        <span class="folder-v128-scene" aria-hidden="true">
          <span class="folder-v144-motion">
            <span class="folder-v128-shell">
              <span class="folder-v128-aura"></span>
              <span class="folder-v128-shadow"></span>
              <img class="folder-v128-back" src="assets/media/folder-v157/folder-back-v157.png" alt="" draggable="false">
              <span class="folder-v128-document-window">
                <span class="folder-v128-documents">
                  <img class="folder-v128-document folder-v128-document-left" src="assets/media/folder-v98-flat/paper-left.png?v=v98-compact-2" alt="" draggable="false">
                  <img class="folder-v128-document folder-v128-document-right" src="assets/media/folder-v98-flat/paper-right.png?v=v98-compact-2" alt="" draggable="false">
                  <img class="folder-v128-document folder-v128-document-center" src="assets/media/folder-v98-flat/paper-center-resume-v2.png?v=front-resume-2" alt="" draggable="false">
                </span>
              </span>
              <img class="folder-v128-front" src="assets/media/folder-v157/folder-front-editable.png?v=front-png-1" alt="" draggable="false"><svg class="landing-folder-copy" viewBox="0 0 1254 1254" aria-hidden="true"><g transform="translate(710 768) matrix(1 -.20 -.12 1 0 0)"><text id="landingHeadline" x="0" y="-83" font-size="36" font-weight="800"></text><text id="landingTitle" x="0" y="0" font-size="91" font-weight="800"></text><text id="landingSubtitle" x="0" y="78" font-size="34" font-weight="700"></text></g></svg>
            </span>
          </span>
        </span>
      </button>
      <p class="landing-help">CLICK TO OPEN</p>
    </section>

    <section class="workspace" id="workspace" aria-hidden="true">
      <header class="topbar">
        <button class="home-button" id="homeButton" type="button" aria-label="처음으로" title="랜딩 페이지로 돌아가기"><span class="home-emblem" aria-hidden="true"><span class="home-emblem-back"></span><span class="home-emblem-page"></span><span class="home-emblem-front"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7 9 12l5 5M9 12h9"/></svg></span></span><span class="home-wordmark"><strong>PORTFOLIO</strong><small>처음으로 돌아가기</small></span></button>
        <div class="breadcrumb" id="breadcrumb">포트폴리오 / 소개</div>
        <span class="topbar-spacer" aria-hidden="true"></span>
      </header>

      <div class="workspace-shell">
        <aside class="list-pane">
          <div class="list-pane-header">
            <div class="list-title-group">
              <h2 class="list-heading" id="listHeading">목차</h2>
            </div>
            <button class="back-button-local" id="backButton" type="button" hidden>← 뒤로</button>
          </div>
          <div class="location-trail" id="locationTrail" aria-label="Current location"></div>
          <nav class="item-list" id="itemList" aria-label="Portfolio sections"></nav>
        </aside>

        <article class="content-pane" id="contentPane">
          <div class="content-inner" id="contentInner"></div>
        </article>
      </div>
    </section>
  </main>

  <script src="assets/js/grid.js?v=vector83"></script>
  <script src="assets/js/data.js?v=optimized-media-1"></script>
  <script src="assets/js/core.js?v=v196-works-label"></script>
  <script src="assets/js/views/portfolio.js?v=timeline-schools-11"></script>
  <script src="assets/js/views/project.js?v=result-scenes-1"></script>
  <script src="assets/js/views/works.js?v=v198-half-solo"></script>
  <script src="assets/js/views/process.js?v=v173-image-first"></script>
  <script src="assets/js/navigation.js?v=v196-works-label"></script>
  <script src="assets/js/app.js?v=image-dismiss-2"></script>
<script>if(location.hash==="#project")PortfolioApp.Navigation.openWorkspace();</script><script src="assets/js/landing-copy.js?v=a4-report-1"></script></body>
</html>
